name: Adventsbingo – Browser-Vorabtest und 60-Minuten-Dauerlast

on:
  push:
    branches: ['test/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-soak:
    name: Browser-Funktionsprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Echter Browser-Vorabtest (30 Sekunden)
        run: SOAK_DURATION_MS=30000 node --test tests/browser-soak.test.cjs
      - name: 60-Minuten-Dauerlast (nur manuell gestartet)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: node --test tests/browser-soak.test.cjs
      - name: Testprotokoll hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventsbingo-browser-soak-report
          path: artifacts/browser-soak-report.json
          if-no-files-found: warn
          retention-days: 30
